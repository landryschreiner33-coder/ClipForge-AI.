name: ClipForge AI conversation check
# Talks with ClipForge AI on the real built-in model (the pinned llama.cpp engine and the Basic or Standard model,
# downloaded and checked the way the app does it) on real Linux and Mac machines, through the app's own chat: a
# greeting, the owner's projects, memories, the conversation so far, a standing rule, a delete that must wait for the
# owner's OK, and a helper agent (scripts/assistant_check.py). Must-checks fail the job; how good the answers are is
# reported in the job summary and in the JSON report, never failing.
on:
  push:
    branches: ['claude/project-thread-sa113l']
    paths: ['clipfoundry/brain/**', 'clipfoundry/builtin_ai.py', 'clipfoundry/pipeline/llm.py',
            'scripts/assistant_check.py', '.github/workflows/assistant-check.yml']
  workflow_dispatch:
    inputs:
      level:
        description: 'The built-in model to talk with: basic (Qwen3-VL 2B, 1.5 GB) or standard (Gemma 4 E4B, 5 GB; meant for 16 GB of memory, so slow on GitHub''s 7 GB Macs)'
        type: choice
        options: [basic, standard]
        default: basic
permissions:
  contents: read
concurrency:
  group: assistant-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    if: github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ClipForge's Python packages
        run: python -m pip install -r requirements-dev.txt
      - name: Talk with ClipForge AI on the built-in model
        # leaves time to upload the report (it is rewritten after every turn) when the conversation runs long
        timeout-minutes: 50
        env:
          LEVEL: ${{ inputs.level || 'basic' }}
        run: python scripts/assistant_check.py --out "$RUNNER_TEMP/assistant-check.json" --data "$RUNNER_TEMP/assistant-data" --level "$LEVEL"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assistant-check-${{ matrix.os }}-${{ inputs.level || 'basic' }}
          path: |
            ${{ runner.temp }}/assistant-check.json
            ${{ runner.temp }}/assistant-data/logs/
          retention-days: 14
