name: Shorts sample pictures
# Makes the pictures of the sample animated shorts with the real picture model on GitHub Linux machines
# (scripts/shorts_pictures.py), because the workspace where ClipForge is developed cannot download the models. Each
# batch in scripts/samples/ is made once: a picture that is already in docs/clipforge/shorts-samples/ is skipped.
# A machine has no graphics card and 16 GB of memory (a picture takes many minutes), so a batch is shared between a
# few machines, each with extra swap; every picture is committed to the branch that asked for it as soon as it is
# made, with the machine's notes (docs/clipforge/shorts-samples/runs/), so a run that is cut short shows what it has.
on:
  push:
    branches: ['claude/project-thread-m6xm4f']
    paths: ['scripts/samples/**', '.github/workflows/shorts-samples.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pictures:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - {spec: batch-1-before, part: 0/3}
          - {spec: batch-1-before, part: 1/3}
          - {spec: batch-1-before, part: 2/3}
          - {spec: batch-2-after, part: 0/4}
          - {spec: batch-2-after, part: 1/4}
          - {spec: batch-2-after, part: 2/4}
          - {spec: batch-2-after, part: 3/4}
    concurrency:
      group: shorts-samples-${{ matrix.spec }}-${{ matrix.part }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Room for the picture model (the second disk, and swap for what 16 GB of memory cannot hold)
        run: |
          sudo mkdir -p /mnt/clipforge && sudo chown "$USER" /mnt/clipforge
          df -h / /mnt
          free_gb=$(df --output=avail -BG /mnt | tail -1 | tr -dc 0-9)
          swap_gb=$(( free_gb > 60 ? 24 : (free_gb > 44 ? 16 : 8) ))
          sudo fallocate -l "${swap_gb}G" /mnt/clipforge-swap && sudo chmod 600 /mnt/clipforge-swap
          sudo mkswap /mnt/clipforge-swap && sudo swapon /mnt/clipforge-swap
          nproc && free -g
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install httpx numpy onnxruntime pillow websockets
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Make the pictures
        run: |
          python scripts/shorts_pictures.py --spec "scripts/samples/${{ matrix.spec }}.json" \
            --part "${{ matrix.part }}" --out docs/clipforge/shorts-samples --data /mnt/clipforge/data --push
