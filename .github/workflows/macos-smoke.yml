name: Apple silicon package smoke test
on:
  push:
    branches: [codex/macos-download-site]
    paths:
      - 'clipfoundry/**'
      - 'frontend/dist/**'
      - 'macos/**'
      - 'requirements*.txt'
      - '.github/workflows/macos-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    if: github.event.repository.private == false
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify native ARM64 setup, Keychain, audio clock and app startup
        run: python3 macos/ci_bootstrap.py
  regression:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        marker: ['not slow', 'slow']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media fixtures and application dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng
          python -m pip install -r requirements-dev.txt
      - name: Run isolated regression suite
        run: python -m pytest -m '${{ matrix.marker }}' -q
