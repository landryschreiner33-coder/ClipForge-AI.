name: YouTube link import check (Mac, diagnostic)
on:
  push:
    branches: [claude/project-thread-8zldhx]
    paths: ['.github/workflows/link-import-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      URL: https://www.youtube.com/watch?v=yWvFwtH4Zzs
      FINDER_PATH: /usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the app's Python packages, FFmpeg and Deno
        run: |
          brew install ffmpeg deno
          python -m pip install -q -r requirements-macos.txt yt-dlp-ejs
          python -m pip list 2>/dev/null | grep -i -E "yt-dlp|httpx"
          mkdir -p "$RUNNER_TEMP/helpers" "$RUNNER_TEMP/js"
          ln -s "$(brew --prefix)/bin/ffmpeg" "$RUNNER_TEMP/helpers/ffmpeg"
          ln -s "$(brew --prefix)/bin/ffprobe" "$RUNNER_TEMP/helpers/ffprobe"
          ln -s "$(brew --prefix)/bin/deno" "$RUNNER_TEMP/js/deno"
          git worktree add "$RUNNER_TEMP/released" 6ecdafc
          cat > "$RUNNER_TEMP/try.py" <<'EOF'
          import json, os, sys, tempfile
          from pathlib import Path
          sys.path.insert(0, os.environ["CODE"])
          os.environ["CLIPFOUNDRY_DATA"] = tempfile.mkdtemp()
          from clipfoundry import db, jobs, media_import
          db.init()
          seen = []
          real = media_import.unavailable
          media_import.unavailable = lambda e: (seen.append([f"{type(x).__name__}: {x}"[:400] for x in media_import._chain(e)]), real(e))[1]
          try:
              path, meta = jobs.fetch_public_video(os.environ["URL"], Path(tempfile.mkdtemp()), max_bytes=4_000_000_000,
                                                   refuse_live=True)
              print("RESULT OK", path.name, path.stat().st_size, "bytes", meta.get("format_id"), meta.get("duration"), "s")
          except Exception as exc:
              print("RESULT FAILED", type(exc).__name__, getattr(exc, "code", ""), exc)
              print(json.dumps(seen, indent=1))
          EOF
      - name: 1. Released code (6ecdafc), as the Mac app runs it
        continue-on-error: true
        run: env PATH="$FINDER_PATH" CLIPFOUNDRY_FFMPEG="$RUNNER_TEMP/helpers" CODE="$RUNNER_TEMP/released" "$(which python)" "$RUNNER_TEMP/try.py"
      - name: 2. Fixed code, no JavaScript runtime
        continue-on-error: true
        run: env PATH="$FINDER_PATH" CLIPFOUNDRY_FFMPEG="$RUNNER_TEMP/helpers" CODE="$PWD" "$(which python)" "$RUNNER_TEMP/try.py"
      - name: 3. Fixed code with Deno
        continue-on-error: true
        run: env PATH="$FINDER_PATH:$RUNNER_TEMP/js" CLIPFOUNDRY_FFMPEG="$RUNNER_TEMP/helpers" CODE="$PWD" "$(which python)" "$RUNNER_TEMP/try.py"
      - name: 4. Formats yt-dlp sees, without and with Deno
        continue-on-error: true
        run: |
          env PATH="$FINDER_PATH" "$(which python)" -m yt_dlp -v -F "$URL" 2>&1 | tail -60
          echo "=========== with deno"
          env PATH="$FINDER_PATH:$RUNNER_TEMP/js" "$(which python)" -m yt_dlp -v -F "$URL" 2>&1 | tail -60
