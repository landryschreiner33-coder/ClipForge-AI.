name: Publish tested personal Mac preview
on:
  push:
    branches: [codex/macos-native-app]
    paths: ['.github/workflows/macos-personal-preview.yml', '.github/scripts/publish_personal_mac.py']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: macos-personal-preview-bc3ce2c
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify and publish the unchanged tested DMG as an unsigned preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/scripts/publish_personal_mac.py
